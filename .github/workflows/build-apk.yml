name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPO_APP_VARIANT: production
      EXPO_ANDROID_PACKAGE: app.getopencode
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/setup-android-release
        with:
          cache-read-only: 'false'
      - run: npm ci
      - name: Build Android release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run build:android
      - name: Stage artifact
        run: |
          set -e
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/opencode-mobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-apk
          path: dist/opencode-mobile.apk
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-synced"
          gh release create "$TAG" dist/opencode-mobile.apk --title "$TAG" --notes "Synced fork release" --draft || true